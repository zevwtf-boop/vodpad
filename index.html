<!doctype html>
<html lang="en" data-theme="ember" data-motion="full" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vodpad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d0f13'/%3E%3Cpath d='M8 9l8 15 8-15' stroke='%23ff4d5e' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/overlays.css">
</head>
<body>

<div id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
      <rect x="1" y="1" width="46" height="46" rx="13" fill="none" stroke="currentColor" stroke-opacity=".35"/>
      <path d="M14 13h13a7.5 7.5 0 0 1 0 15h-7v7h-6z" fill="currentColor"/>
    </svg>
  </div>
  <div class="boot-name">vodpad</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-msg" id="boot-msg">waking the notebook up…</div>
</div>

<div id="app" class="hidden">

  <header id="topbar">
    <div class="tb-side tb-left">
      <button class="icon-btn" id="tb-back" data-tip="back (esc)" hidden></button>
      <nav id="crumbs" class="crumbs"></nav>
    </div>

    <div class="tb-center">
      <div id="tb-title" class="tb-title"></div>
      <div id="save-state" class="save-state"><i></i><span>saved</span></div>
    </div>

    <div class="tb-side tb-right">
      <button class="icon-btn" id="tb-search" data-tip="search everything (ctrl+k)"></button>
      <button class="icon-btn" id="tb-map" data-tip="page ⇄ map (ctrl+shift+b)" hidden></button>
      <button class="icon-btn" id="tb-read" data-tip="read mode (ctrl+r)" hidden></button>
      <button class="icon-btn" id="tb-video" data-tip="video panel (ctrl+shift+v)" hidden></button>
      <button class="icon-btn" id="tb-gear" data-tip="settings"></button>
    </div>
  </header>

  <main id="surfaces">
    <section id="surface-dash"  class="surface" aria-label="dashboard"></section>
    <section id="surface-board" class="surface" aria-label="session board" hidden></section>
    <section id="surface-page"  class="surface" aria-label="page" hidden></section>
  </main>

</div>

<div id="overlays">
  <div id="flip-layer" aria-hidden="true"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="seltoolbar" class="pop" hidden></div>
  <div id="slashmenu" class="pop" hidden></div>
  <div id="ctxmenu" class="pop" hidden></div>
  <div id="popover" class="pop" hidden></div>
  <div id="palette-wrap" class="scrim" hidden><div id="palette"></div></div>
  <div id="gear-wrap" class="scrim" hidden><aside id="gear"></aside></div>
  <div id="modal-wrap" class="scrim" hidden><div id="modal"></div></div>
  <div id="annotate-wrap" class="scrim scrim-solid" hidden><div id="annotate"></div></div>
  <div id="reader-wrap" class="scrim scrim-solid" hidden><div id="reader"></div></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
